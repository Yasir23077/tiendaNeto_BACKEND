# Archivo: application.properties
# Descripción: Configuración de la aplicación y de la conexión a la base de datos.
# Origen: Elaborado con apoyo de Claude y adaptado por el autor; propiedades según la
#         documentación oficial de Spring Boot (docs.spring.io/spring-boot).

# Nombre de la aplicación (aparece en los registros de la consola).
spring.application.name=neto-ventas
app.frontend-origin=${FRONTEND_ORIGIN:http://localhost:5173}

# URL de conexión: MySQL local, puerto 3306, base de datos dedicada a Tiendas NETO.
# createDatabaseIfNotExist=true crea la base si todavía no existe.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/tienda_neto?createDatabaseIfNotExist=true}

# Usuario de la base de datos.
spring.datasource.username=${DB_USERNAME:root}

# Contraseña del usuario (vacía en esta instalación local).
spring.datasource.password=${DB_PASSWORD:}

# Crea o actualiza las tablas automáticamente según las clases @Entity.
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola el SQL que genera Hibernate (útil para depurar).
spring.jpa.show-sql=true

# Evita consultas a la BD durante el renderizado de vistas, quita el aviso de arranque).
spring.jpa.open-in-view=false


#CONTRASEÑAS DE USUARIOS
# Habilita o deshabilita la creacion de cuentas de demostracion al iniciar.
# Para produccion se recomienda establecer NETO_DEMO_USERS_ENABLED=false.
app.security.demo-users.enabled=${NETO_DEMO_USERS_ENABLED:false}
# Contrasena inicial de cajero, configurable con una variable de entorno.
app.security.demo-users.cajero-password=${NETO_CAJERO_PASSWORD:}
# Contrasena inicial de lider, configurable con una variable de entorno.
app.security.demo-users.lider-password=${NETO_LIDER_PASSWORD:}
# Contrasena inicial de encargado, configurable con una variable de entorno.
app.security.demo-users.encargado-password=${NETO_ENCARGADO_PASSWORD:}

# Impide que JavaScript lea directamente la cookie de sesion.
server.servlet.session.cookie.http-only=true
# Reduce el envio de la cookie desde sitios externos.
server.servlet.session.cookie.same-site=lax
