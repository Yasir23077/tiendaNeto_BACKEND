# Archivo: application.properties
# Descripción: Configuración de la aplicación y de la conexión a la base de datos.
# Origen: Elaborado con apoyo de Claude y adaptado por el autor; propiedades según la
#         documentación oficial de Spring Boot (docs.spring.io/spring-boot).

# Nombre de la aplicación (aparece en los registros de la consola).
spring.application.name=neto-ventas

# URL de conexión: MySQL local, puerto 3306, base de datos dedicada a Tiendas NETO.
# createDatabaseIfNotExist=true crea la base si todavía no existe.
spring.datasource.url=jdbc:mysql://localhost:3306/tienda_neto?createDatabaseIfNotExist=true

# Usuario de la base de datos.
spring.datasource.username=root

# Contraseña del usuario (vacía en esta instalación local).
spring.datasource.password=

# Crea o actualiza las tablas automáticamente según las clases @Entity.
spring.jpa.hibernate.ddl-auto=update

# Muestra en consola el SQL que genera Hibernate (útil para depurar).
spring.jpa.show-sql=true

# Evita consultas a la BD durante el renderizado de vistas (buena práctica; quita el aviso de arranque).
spring.jpa.open-in-view=false

# Cuentas de demostración para desarrollo. En otro entorno define contraseñas
# mediante variables NETO_CAJERO_PASSWORD, NETO_LIDER_PASSWORD y NETO_ENCARGADO_PASSWORD.
app.security.demo-users.enabled=${NETO_DEMO_USERS_ENABLED:true}
app.security.demo-users.cajero-password=${NETO_CAJERO_PASSWORD:CajaNeto2026!}
app.security.demo-users.lider-password=${NETO_LIDER_PASSWORD:LiderNeto2026!}
app.security.demo-users.encargado-password=${NETO_ENCARGADO_PASSWORD:Encargado2026!}

server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax
