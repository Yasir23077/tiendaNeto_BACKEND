<!-- Documento inicial que carga React dentro del elemento #root. -->
<!-- Documento base: define el idioma, metadatos y punto de montaje de React. -->
<!doctype html>
<html lang="es">
  <head>
    <!-- Permite mostrar correctamente los caracteres del español. -->
    <meta charset="UTF-8" />
    <!-- Hace que el diseño use el ancho real de cada pantalla. -->
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistema de ventas NETO</title>
  </head>
  <body>
    <!-- React monta la interfaz completa dentro de este elemento. -->
    <div id="root"></div>
    <!-- Carga el módulo JavaScript que inicia la aplicación. -->
    <script type="module" src="/src/principal.jsx"></script>
  </body>
</html>
